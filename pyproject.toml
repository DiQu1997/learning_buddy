[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "learning-buddy"
version = "0.3.0"
description = "Inbox -> classify -> NotebookLM, with a git-backed catalog (gitkv)."
readme = "DESIGN.md"
requires-python = ">=3.10"
dependencies = [
  "PyMuPDF>=1.24.0",
  "openai>=1.40.0",
  "python-dotenv>=1.0.0",
  "gitkv @ git+https://github.com/DiQu1997/Git-KV-store@v0.4.0",
]

[project.scripts]
learning-buddy = "learning_buddy.cli:main"

[tool.setuptools]
packages = ["learning_buddy"]
